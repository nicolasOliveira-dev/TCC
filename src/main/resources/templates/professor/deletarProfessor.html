<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletar Professor - EduGrid</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="standalone-form-body">

    <div class="form-card-container sm">
        
        <!-- Header sem navegação -->
        <div class="form-card-header">
            <div class="brand-badge">
                <span>❖</span> EduGrid
            </div>
            <div class="warning-icon-wrapper">
                ⚠️
            </div>
            <h1>Deletar Professor</h1>
            <p>Informe o ID do professor que deseja remover do sistema.</p>
        </div>

        <div class="warning-box">
            <span>Atenção: Esta ação é irreversível e removerá o cadastro do professor permanentemente.</span>
        </div>

        <!-- Formulário HTML com Thymeleaf -->
        <form class="edugrid-form" action="/professor/deletar" th:action="@{/professor/deletar}" method="post">

            <div class="form-group">
                <label for="id">ID do Professor:</label>
                <input
                    class="form-input danger-focus"
                    type="number"
                    id="id"
                    name="id"
                    placeholder="Digite o ID do professor"
                    required>
            </div>

            <!-- Botões -->
            <div class="form-actions">
                <a class="btn-secondary" th:href="@{/professor}" href="/professor">Cancelar</a>
                <button class="btn-danger" type="submit">Excluir Professor</button>
            </div>

        </form>
        
    </div>

</body>
</html>
