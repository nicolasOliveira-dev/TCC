<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professor - EduGrid</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="standalone-form-body">

    <div class="form-card-container">
        
        <!-- Header sem navegação -->
        <div class="form-card-header">
            <div class="brand-badge">
                <span>❖</span> EduGrid
            </div>
            <h1>Cadastro de Professor</h1>
            <p>Preencha os dados abaixo para cadastrar um novo professor.</p>
        </div>

        <!-- Formulário HTML com suporte a Thymeleaf e Action Padrão -->
        <form class="edugrid-form" action="/professor/salvar" th:action="@{/professor/salvar}" method="post">

            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input
                    class="form-input"
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite o nome completo do professor"
                    required>
            </div>

            <div class="form-group">
                <label for="areaAtuacao">Área de Atuação:</label>
                <input
                    class="form-input"
                    type="text"
                    id="areaAtuacao"
                    name="areaAtuacao"
                    placeholder="Ex: Matemática, Física, História"
                    required>
            </div>

            <div class="form-group">
                <label for="cargaHoraria">Carga Horária Semanal (horas):</label>
                <input
                    class="form-input"
                    type="number"
                    id="cargaHoraria"
                    name="cargaHoraria"
                    min="1"
                    placeholder="Ex: 40"
                    required>
            </div>

            <!-- Botões -->
            <div class="form-actions">
                <a class="btn-secondary" th:href="@{/professor}" href="/professor">Cancelar</a>
                <button class="btn-primary" type="submit">Salvar Professor</button>
            </div>

        </form>
        
    </div>

</body>
</html>
