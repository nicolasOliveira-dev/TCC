<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGrid - Professores</title>
  <meta name="description" content="Gerenciamento de professores cadastrados no EduGrid.">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

  <div class="app-container" id="appContainer">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          Edu Grid
        </div>
      </div>

       <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item" id="menuDashboard"><span class="icon">▦</span><span>Dashboard</span></a>
        <a th:href="@{/professor/professor}" class="nav-item active" id="menuProfessores" aria-current="page"><span class="icon">🧑‍🏫</span><span>Professores</span></a>
        <a th:href="@{/turma/turma}" class="nav-item" id="menuTurmas"><span class="icon">🎒</span><span>Turmas</span></a>
        <a th:href="@{/disciplina/disciplina}" class="nav-item" id="menuDisciplinas"><span class="icon">📚</span><span>Disciplinas</span></a>
        <a th:href="@{/curso/curso}" class="nav-item" id="menuCursos"><span class="icon">🎓</span><span>Cursos</span></a>
        <a th:href="@{/gradeHoraria/gerar}" class="nav-item" id="menuGerarGrade"><span class="icon">✨</span><span>Gerar Grade</span></a>
      </nav>

      <div class="sidebar-footer">
        <a th:href="@{/sair}" class="logout-btn">
          <span>←</span>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <div class="main-wrapper">

      <header class="topbar">
        <div class="topbar-left">

          <button class="toggle-menu-btn" id="toggleMenuBtn" aria-label="Abrir ou fechar menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <h1 class="page-title">Professores</h1>
        </div>

        <div class="topbar-right">
          <div class="user-badge" th:title="${nomeUsuario}" th:text="${iniciaisUsuario}">EG</div>
        </div>
      </header>

      <main class="content-body">

        <div class="page-main-header">
          <div class="title-group">
            <span class="title-icon">🧑‍🏫</span>
            <h2>Professores</h2>
          </div>
          <a class="add-btn" th:href="@{/professor/salvar}"><span>+</span> Adicionar professor</a>
        </div>

        <div class="data-table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>NOME</th>
                <th>ÁREA DE ATUAÇÃO</th>
                <th>CARGA HORÁRIA</th>
                <th>AÇÕES</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="professor : ${professores}">
                <td th:text="${professor.id}">1</td>
                <td th:text="${professor.nome}">Nome do professor</td>
                <td th:text="${professor.areaAtuacao}">Área de atuação</td>
                <td th:text="${professor.cargaHoraria}">Carga horária</td>
                <td>
                  <a class="btn-secondary" th:href="@{/professor/atualizar(id=${professor.id})}">Atualizar</a>
                  <form class="inline-form" th:action="@{/professor/deletar}" method="post" onsubmit="return confirm('Deseja realmente excluir este professor?');">
                    <input type="hidden" name="id" th:value="${professor.id}">
                    <button class="btn-danger" type="submit">Excluir</button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(professores)}"><td colspan="5">Nenhum professor cadastrado.</td></tr>
            </tbody>
          </table>
        </div>
      </main>

      <button class="help-fab" title="Ajuda">?</button>
    </div>
  </div>

  <script th:src="@{/js/script.js}"></script>
</body>
</html>
