<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGrid - Entrar na conta</title>
  <meta name="description" content="Acesse o EduGrid para gerenciar cadastros e grades horárias.">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <main class="auth-page-container">
    <div class="auth-card">
      <div class="auth-logo-badge">Edu Grid</div>
      <h1 id="authTitle">Entrar na conta</h1>
      <p class="subtitle">Acesse o painel e gerencie suas grades horárias.</p>

      <p class="auth-feedback auth-feedback-success" role="status"
         th:if="${cadastroConcluido}" th:text="${cadastroConcluido}"></p>
      <p class="auth-feedback auth-feedback-error" role="alert"
         th:if="${param.erro}">E-mail ou senha incorretos.</p>

      <form class="auth-form" th:action="@{/login}" method="post">
        <div class="form-group">
          <label for="emailInput">E-mail</label>
          <input type="email" id="emailInput" name="email" class="form-input"
                 placeholder="seuemail@escola.edu" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="passwordInput">Senha</label>
          <input type="password" id="passwordInput" name="senha" class="form-input"
                 placeholder="Sua senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="auth-submit-btn" id="authSubmitBtn">Entrar</button>
      </form>
      <div class="auth-footer">Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></div>
    </div>
  </main>
</body>
</html>
