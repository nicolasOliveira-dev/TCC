<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Turma - EduGrid</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="standalone-form-body">

    <div class="form-card-container">
        
        <!-- Header sem navegação -->
        <div class="form-card-header">
            <div class="brand-badge">
                <span>❖</span> EduGrid
            </div>
            <h1>Atualizar Turma</h1>
            <p>Altere os dados necessários e confirme a atualização da turma.</p>
        </div>

        <!-- Formulário HTML com Thymeleaf / Action -->
        <form class="edugrid-form" action="turma/atualizar" th:action="@{/turma/atualizar}" th:object="${turma}" method="post">

            <div class="form-row">
                <div class="form-group">
                    <label for="id">ID da Turma:</label>
                    <input
                        class="form-input"
                        type="number"
                        id="id"
                        name="id"
                        th:field="*{id}"
                        placeholder="Ex: 1"
                        required>
                </div>

                <div class="form-group">
                    <label for="nome">Nome da Turma:</label>
                    <input
                        class="form-input"
                        type="text"
                        id="nome"
                        name="nome"
                        th:field="*{nome}"
                        placeholder="Digite o nome da turma"
                        required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="curso">Curso:</label>
                    <select
                        class="form-input"
                        id="curso"
                        name="curso"
                        th:field="*{curso}"
                        required>
                        <option value="">Selecione um curso</option>
                        <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nomeCurso}">Engenharia de Software</option>
                    </select>
                </div>
            </div>

            <fieldset class="discipline-selector">
                <legend>Disciplinas</legend>
                <p class="form-help-text">Selecione as disciplinas que serão ministradas nesta turma.</p>
                <div class="discipline-options" th:if="${!#lists.isEmpty(disciplinas)}">
                    <label class="discipline-option" th:each="d : ${disciplinas}">
                        <input type="checkbox" th:field="*{disciplinas}" th:value="${d.id}">
                        <span th:text="${d.nome}">Disciplina</span>
                    </label>
                </div>
                <p class="form-help-text" th:if="${#lists.isEmpty(disciplinas)}">Nenhuma disciplina cadastrada no sistema.</p>
            </fieldset>

            <!-- Botões -->
            <div class="form-actions">
                <a class="btn-secondary" th:href="@{/turma}" href="/turma">Cancelar</a>
                <button class="btn-primary" type="submit">Atualizar Turma</button>
            </div>

        </form>
        
    </div>

</body>
</html>
