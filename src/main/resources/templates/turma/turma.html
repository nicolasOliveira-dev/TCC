<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGrid - Turmas</title>
  <meta name="description" content="Gerenciamento de turmas cadastradas no EduGrid.">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

  <div class="app-container" id="appContainer">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          Edu Grid
        </div>
      </div>

      <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item" id="menuDashboard"><span class="icon">▦</span><span>Dashboard</span></a>
        <a th:href="@{/professor/professor}" class="nav-item" id="menuProfessores"><span class="icon">🧑‍🏫</span><span>Professores</span></a>
        <a th:href="@{/turma/turma}" class="nav-item active" id="menuTurmas" aria-current="page"><span class="icon">🎒</span><span>Turmas</span></a>
        <a th:href="@{/disciplina/disciplina}" class="nav-item" id="menuDisciplinas"><span class="icon">📚</span><span>Disciplinas</span></a>
        <a th:href="@{/curso/curso}" class="nav-item" id="menuCursos"><span class="icon">🎓</span><span>Cursos</span></a>
        <a th:href="@{/gradeHoraria/gerar}" class="nav-item" id="menuGerarGrade"><span class="icon">✨</span><span>Gerar Grade</span></a>
      </nav>

      <div class="sidebar-footer">
        <a th:href="@{/sair}" class="logout-btn">
          <span>←</span>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <div class="main-wrapper">

      <header class="topbar">
        <div class="topbar-left">

          <button class="toggle-menu-btn" id="toggleMenuBtn" aria-label="Abrir ou fechar menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <h1 class="page-title">Turmas</h1>
        </div>

        <div class="topbar-right">
          <div class="user-badge" th:title="${nomeUsuario}" th:text="${iniciaisUsuario}">EG</div>
        </div>
      </header>

      <main class="content-body">

        <div class="page-main-header">
          <div class="title-group">
            <span class="title-icon">🎒</span>
            <h2>Turmas</h2>
          </div>
          <button class="add-btn" id="addTurmaBtn" >
            <span>+</span> Adicionar turma
          </button>
        </div>

        <div class="data-table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>TURMA</th>
                <th>CURSO</th>
                <th>TAMANHO GRADE</th>
                <th>DISCIPLINAS</th>
                <th>AÇÕES</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="turma : ${turmas}">
                <td><strong th:text="${turma.nome}">Nome da turma</strong></td>
                <td th:text="${turma.curso != null ? turma.curso.nomeCurso : '-'}">-</td>
                <td th:text="${turma.tamanhoGrade != null ? turma.tamanhoGrade.qtdeDiasSemana + ' dias x ' + turma.tamanhoGrade.qtdePeriodosDia + ' períodos' : '-'}">-</td>
                <td>
                  <span th:each="disciplina, status : ${turma.disciplinas}" th:text="${disciplina.nome + (status.last ? '' : ', ')}">Disciplina</span>
                  <span th:if="${#lists.isEmpty(turma.disciplinas)}">-</span>
                </td>
                <td>
                  <div class="table-actions">
                    <a class="btn-secondary" th:href="@{/turma/atualizar(id=${turma.id})}">Atualizar</a>
                    <form class="inline-form" th:action="@{/turma/deletar}" method="post" onsubmit="return confirm('Deseja realmente excluir esta turma?');">
                      <input type="hidden" name="id" th:value="${turma.id}">
                      <button class="btn-danger" type="submit">Excluir</button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(turmas)}">
                <td colspan="5">Nenhuma turma cadastrada.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>

      <button class="help-fab" title="Ajuda">?</button>
    </div>
  </div>

  <script th:src="@{/js/script.js}"></script>
</body>
</html>
