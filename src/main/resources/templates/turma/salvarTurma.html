<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Turma - EduGrid</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="standalone-form-body">

    <div class="form-card-container">
        
        <!-- Header sem navegação -->
        <div class="form-card-header">
            <div class="brand-badge">
                <span>❖</span> EduGrid
            </div>
            <h1>Cadastro de Turma</h1>
            <p>Preencha os dados abaixo para cadastrar uma nova turma.</p>
        </div>

        <!-- Formulário HTML com Thymeleaf -->
        <form class="edugrid-form" th:action="@{/turma/salvar}" th:object="${turma}" method="post">

            <!-- Campo oculto para edição -->
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nome">Nome da Turma:</label>
                <input
                    class="form-input"
                    type="text"
                    id="nome"
                    th:field="*{nome}"
                    placeholder="Digite o nome da turma (ex: 3º Ano A)"
                    required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="disciplina">Disciplina:</label>
                    <input
                        class="form-input"
                        type="text"
                        id="disciplina"
                        th:field="*{disciplina}"
                        placeholder="Digite a disciplina"
                        required>
                </div>

                <div class="form-group">
                    <label for="curso">Curso:</label>
                    <input
                        class="form-input"
                        type="text"
                        id="curso"
                        th:field="*{curso}"
                        placeholder="Digite o curso"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="historicoProfessor">Histórico de Professores:</label>
                <textarea
                    class="form-textarea"
                    id="historicoProfessor"
                    th:field="*{historicoProfessor}"
                    rows="4"
                    placeholder="Informe o histórico de professores"></textarea>
            </div>

            <!-- Botões -->
            <div class="form-actions">
                <a class="btn-secondary" th:href="@{/turma}">Cancelar</a>
                <button class="btn-primary" type="submit">Salvar Turma</button>
            </div>

        </form>
        
    </div>

</body>
</html>
