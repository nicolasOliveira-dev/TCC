<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atualizar Disciplina - EduGrid</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="standalone-form-body">

  <div class="form-card-container">

    <div class="form-card-header">
      <div class="brand-badge">
        <span>❖</span> EduGrid
      </div>
      <h1>Atualizar Disciplina</h1>
      <p>Altere os dados necessários e confirme a atualização da disciplina.</p>
    </div>

    <form class="edugrid-form" th:action="@{/disciplina/atualizar}" th:object="${disciplina}" method="post">
      <input type="hidden" name="id" th:value="${disciplina.id}">

      <div class="form-row">
        <div class="form-group">
          <label for="cargaHoraria">Carga Horária (horas):</label>
          <input
            class="form-input"
            type="number"
            step="0.1"
            id="cargaHoraria"
            th:field="*{cargaHoraria}"
            placeholder="Ex: 60"
            min="1"
            required>
        </div>
      </div>

      <div class="form-group">
        <label for="nome">Nome da Disciplina:</label>
        <input
          class="form-input"
          type="text"
          id="nome"
          th:field="*{nome}"
          placeholder="Digite o nome da disciplina"
          required>
      </div>

      <div class="form-group">
        <label for="areaAtuacao">Área de Atuação:</label>
        <input
          class="form-input"
          type="text"
          id="areaAtuacao"
          th:field="*{areaAtuacao}"
          placeholder="Informe a área de atuação">
      </div>

      <div class="form-group">
        <label for="tipoDisciplina">Tipo de Disciplina:</label>
        <input
          class="form-input"
          type="text"
          id="tipoDisciplina"
          th:field="*{tipoDisciplina}"
          placeholder="Ex: técnica, comum ou eletiva">
      </div>

      <div class="form-group">
        <label for="minPeriodosJuntos">Número mínimo de períodos juntos:</label>
        <input
          class="form-input"
          type="number"
          id="minPeriodosJuntos"
          th:field="*{minPeriodosJuntos}"
          min="1"
          required>
      </div>

      <div class="form-group">
        <label for="maxPeriodosJuntos">Número máximo de períodos juntos:</label>
        <input
          class="form-input"
          type="number"
          id="maxPeriodosJuntos"
          th:field="*{maxPeriodosJuntos}"
          min="1"
          required>
      </div>

      <div class="form-actions">
        <a class="btn-secondary" th:href="@{/disciplina/disciplina}">Cancelar</a>
        <button class="btn-primary" type="submit" >Atualizar Disciplina</button>
      </div>

    </form>
    <script  src="/js/script.js"></script>
  </div>

</body>
</html>
