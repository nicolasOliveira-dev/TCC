<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGrid - Disciplinas</title>
  <meta name="description" content="Gerenciamento de disciplinas cadastradas no EduGrid.">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

  <div class="app-container" id="appContainer">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          Edu Grid
        </div>
      </div>

      <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item" id="menuDashboard"><span class="icon">▦</span><span>Dashboard</span></a>
        <a th:href="@{/professor/professor}" class="nav-item" id="menuProfessores"><span class="icon">🧑‍🏫</span><span>Professores</span></a>
        <a th:href="@{/turma/turma}" class="nav-item" id="menuTurmas"><span class="icon">🎒</span><span>Turmas</span></a>
        <a th:href="@{/disciplina/disciplina}" class="nav-item active" id="menuDisciplinas" aria-current="page"><span class="icon">📚</span><span>Disciplinas</span></a>
        <a th:href="@{/curso/curso}" class="nav-item" id="menuCursos"><span class="icon">🎓</span><span>Cursos</span></a>
        <a th:href="@{/gradeHoraria/gerar}" class="nav-item" id="menuGerarGrade"><span class="icon">✨</span><span>Gerar Grade</span></a>
      </nav>

      <div class="sidebar-footer">
        <a th:href="@{/sair}" class="logout-btn">
          <span>←</span>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <div class="main-wrapper">

      <header class="topbar">
        <div class="topbar-left">

          <button class="toggle-menu-btn" id="toggleMenuBtn" aria-label="Abrir ou fechar menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <h1 class="page-title">Disciplinas</h1>
        </div>

        <div class="topbar-right">
          <div class="user-badge" th:title="${nomeUsuario}" th:text="${iniciaisUsuario}">EG</div>
        </div>
      </header>

      <main class="content-body">

        <div class="page-main-header">
          <div class="title-group">
            <span class="title-icon">📚</span>
            <h2>Disciplinas</h2>
          </div>
          <a class="add-btn" th:href="@{/disciplina/salvar}"><span>+</span> Adicionar disciplina</a>
        </div>

        <div class="data-table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>DISCIPLINA</th>
                <th>ÁREA DE ATUAÇÃO</th>
                <th>PERÍODOS</th>
                <th>MÍNIMO DE PERÍODOS JUNTOS</th>
                <th>MÁXIMO DE PERÍODOS JUNTOS</th>
                <th>TIPO</th>
                <th>AÇÕES</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="disciplina : ${disciplinas}">
                <td th:text="${disciplina.id}"></td>
                <td th:text="${disciplina.nome}"></td>
                <td th:text="${disciplina.areaAtuacao}"></td>
                <td th:text="${disciplina.numPeriodos}"></td>
                <td th:text="${disciplina.minPeriodosJuntos}"></td>
                <td th:text="${disciplina.maxPeriodosJuntos}"></td>
                <td th:text="${disciplina.tipoDisciplina}"></td>
                <td>
                  <div class="table-actions">
                    <a class="btn-secondary" th:href="@{/disciplina/atualizar(id=${disciplina.id})}">Atualizar</a>
                    <form class="inline-form" th:action="@{/disciplina/deletar}" method="post" onsubmit="return confirm('Deseja realmente excluir esta disciplina?');">
                      <input type="hidden" name="id" th:value="${disciplina.id}">
                      <button class="btn-danger" type="submit">Excluir</button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(disciplinas)}"><td colspan="8">Nenhuma disciplina cadastrada.</td></tr>
            </tbody>
          </table>
        </div>
      </main>

      <button class="help-fab" title="Ajuda">?</button>
    </div>
  </div>

  <script th:src="@{/js/script.js}"></script>
</body>
</html>
